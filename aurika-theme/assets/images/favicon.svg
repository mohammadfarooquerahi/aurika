<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d07a"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="60%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="248" fill="#111118" stroke="url(#goldGrad)" stroke-width="12"/>
  
  <!-- Candle Flame -->
  <path d="M256 95 C242 135 230 160 230 185 C230 206 242 220 256 220 C270 220 282 206 282 185 C282 160 270 135 256 95 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  
  <!-- Aurika Monogram 'A' -->
  <text x="256" y="380" font-family="'Playfair Display', Georgia, serif" font-size="200" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">A</text>
  
  <!-- Small Star Sparkle -->
  <circle cx="256" cy="425" r="4" fill="#f3d07a"/>
</svg>
